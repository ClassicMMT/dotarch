# Control your input devices
# See https://wiki.hypr.land/Configuring/Variables/#input
input {
  left_handed = true


  # Use multiple keyboard layouts and switch between them with Left Alt + Right Alt
  # kb_layout = us,dk,eu
  kb_layout = us
  kb_options = compose:caps # ,grp:alts_toggle


  # Change speed of keyboard repeat
  repeat_rate = 40
  repeat_delay = 400

  # Start with numlock on by default
  numlock_by_default = true

  # Increase sensitivity for mouse/trackpad (default: 0)
  # sensitivity = 0.35

  # Control the speed of your scrolling
  scroll_factor = 2.5
  natural_scroll = true

  touchpad {
    # Use natural (inverse) scrolling
    natural_scroll = true

    # Use two-finger clicks for right-click instead of lower-right corner
    clickfinger_behavior = true

    # Control the speed of your scrolling
    scroll_factor = 0.4

    # Left-click-and-drag with three fingers
    drag_3fg = 1
  }
}

# for mx vertical:
# Generated with fufexan's macOS gist (e6bcccb7787116b8f9c31160fc8bc543).
# Cubic curves: factor = low*v + mid*v^2 + high*v^3
# CURSOR: low=0.30,  mid=0.025,  high=0.017   — low unchanged, ~50% more at high velocity.
# SCROLL: low=0.30,  mid=0.029,  high=0.0225  — low unchanged, ~50% more at high velocity.
# scroll_factor stacks on top of scroll_points.
# libinput requires accel_profile=custom to enable scroll_points.
device {
  name = logitech-mx-vertical-advanced-ergonomic-mouse
  natural_scroll = true
  scroll_factor = 1.0
  accel_profile = custom 0.5 0.000 0.158 0.342 0.564 0.836 1.172 1.584 2.085 2.688 3.405 4.250 5.235 6.372 7.675 9.156 10.828 12.704 14.796 17.118 19.682
  # Disabled: libinput velocity-based scroll accel causes inconsistent first-event feel.
  # scroll_points = 0.5 0.000 0.160 0.352 0.591 0.896 1.283 1.768 2.370 3.104 3.988 5.037 6.271 7.704 9.354 11.238 13.373 15.776 18.463 21.451 24.758
}

device {
  name = protoarc-em11-nl
  natural_scroll = true
  scroll_factor = 1.0
}

# Scroll nicely in the terminal
windowrule = match:class (Alacritty|kitty|foot), scroll_touchpad 3
windowrule = match:class com.mitchellh.ghostty, scroll_touchpad 0.2

# change workspaces with 4 fingers
gesture = 4, horizontal, workspace
