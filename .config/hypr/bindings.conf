### OMARCHY DEFAULTS

# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker




### CUSTOM

# Unbind defaults that conflict with HJKL window navigation
unbind = SUPER, J  # was: Toggle window split (rebound to Super+;)
unbind = SUPER, K  # was: Show key bindings
unbind = SUPER, L  # was: Toggle workspace layout (dwindle<->scrolling) — keep vim focus-right only

# Rebind toggle window split
bindd = SUPER, semicolon, Toggle window split, layoutmsg, togglesplit

# Unbind monitor scaling cycle
unbind = SUPER, code:61
unbind = SUPER ALT, code:61

# Unbind default arrow key window management (now handled by HJKL)
unbind = SUPER, LEFT
unbind = SUPER, RIGHT
unbind = SUPER, UP
unbind = SUPER, DOWN
unbind = SUPER SHIFT, LEFT
unbind = SUPER SHIFT, RIGHT
unbind = SUPER SHIFT, UP
unbind = SUPER SHIFT, DOWN

# Window focus with SUPER + HJKL (vim-style)
bindd = SUPER, H, Move window focus left, movefocus, l
bindd = SUPER, L, Move window focus right, movefocus, r
bindd = SUPER, K, Move window focus up, movefocus, u
bindd = SUPER, J, Move window focus down, movefocus, d

# Swap windows with SUPER + SHIFT + HJKL
bindd = SUPER SHIFT, H, Swap window to the left, swapwindow, l
bindd = SUPER SHIFT, L, Swap window to the right, swapwindow, r
bindd = SUPER SHIFT, K, Swap window up, swapwindow, u
bindd = SUPER SHIFT, J, Swap window down, swapwindow, d


# equalise column widths on the focused monitor
bindd = SUPER, E, Equalize columns, exec, ~/.config/hypr/scripts/gridify-columns


# hyprwhspr - Toggle mode
# Press once to start, press again to stop
bindd = SUPER, D, Speech-to-text, exec, /usr/lib/hyprwhspr/config/hyprland/hyprwhspr-tray.sh record


# Move ALL windows on the current workspace to another workspace, then follow.
# SUPER+CTRL+SHIFT+[1-9,0] — mirrors omarchy's SUPER+SHIFT (single-window) map;
bindd = SUPER CTRL SHIFT, code:10, Move all windows to workspace 1, exec, ~/.config/hypr/scripts/move-all-to-workspace 1
bindd = SUPER CTRL SHIFT, code:11, Move all windows to workspace 2, exec, ~/.config/hypr/scripts/move-all-to-workspace 2
bindd = SUPER CTRL SHIFT, code:12, Move all windows to workspace 3, exec, ~/.config/hypr/scripts/move-all-to-workspace 3
bindd = SUPER CTRL SHIFT, code:13, Move all windows to workspace 4, exec, ~/.config/hypr/scripts/move-all-to-workspace 4
bindd = SUPER CTRL SHIFT, code:14, Move all windows to workspace 5, exec, ~/.config/hypr/scripts/move-all-to-workspace 5
bindd = SUPER CTRL SHIFT, code:15, Move all windows to workspace 6, exec, ~/.config/hypr/scripts/move-all-to-workspace 6
bindd = SUPER CTRL SHIFT, code:16, Move all windows to workspace 7, exec, ~/.config/hypr/scripts/move-all-to-workspace 7
bindd = SUPER CTRL SHIFT, code:17, Move all windows to workspace 8, exec, ~/.config/hypr/scripts/move-all-to-workspace 8
bindd = SUPER CTRL SHIFT, code:18, Move all windows to workspace 9, exec, ~/.config/hypr/scripts/move-all-to-workspace 9
bindd = SUPER CTRL SHIFT, code:19, Move all windows to workspace 10, exec, ~/.config/hypr/scripts/move-all-to-workspace 10
